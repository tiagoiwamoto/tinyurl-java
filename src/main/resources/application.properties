spring.application.name=tinylink

spring.datasource.url=${POSTGRES_URI:jdbc:postgresql://localhost:5432/tinylink}
spring.datasource.username=${POSTGRES_USERNAME:tinylink}
spring.datasource.password=${POSTGRES_PASSWORD:tinylink}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

tinylink.admin-user=${TINYLINK_ADMIN_USER:admin}
tinylink.admin-password=${TINYLINK_ADMIN_PASSWORD:admin}
tinylink.jwt-secret=${TINYLINK_JWT_SECRET:change-me-change-me-change-me-32b!}
tinylink.jwt-expiration-minutes=${TINYLINK_JWT_EXPIRATION_MINUTES:1440}
tinylink.base-url=${BASE_URL:https://encurtador-link.kamehouse.com.br}
tinylink.allowed-origin-patterns=${ALLOWED_ORIGINS:https://encurtador-link.kamehouse.com.br,http://localhost:*,http://127.0.0.1:*}
tinylink.refresh-rate-seconds=3
tinylink.link-length=10
tinylink.page-size=10
tinylink.ad-html=<div align="center"><strong>Seu anuncio aqui</strong></div>
