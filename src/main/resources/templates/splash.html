<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" th:content="${refreshRate} + ';url=' + ${fullUrl}">
  <title>Redirecionando...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    a { color: #0095ff; }
  </style>
</head>
<body>
  <h2>Você será redirecionado em <span th:text="${refreshRate}">3</span> segundos...</h2>
  <p>Destino: <a th:href="${fullUrl}" th:text="${fullUrl}"></a></p>
  <div th:utext="${adHtml}"></div>
</body>
</html>
