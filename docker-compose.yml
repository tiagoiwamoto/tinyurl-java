services:
  app:
    build: .
    container_name: tinylink-java-app
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/tinylink
      DB_USER: tinylink
      DB_PASSWORD: tinylink
      BASE_URL: http://localhost:8081
      TINYLINK_ADMIN_USER: admin
      TINYLINK_ADMIN_PASSWORD: admin
      TINYLINK_JWT_SECRET: change-me-change-me-change-me-32b!
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tinylink-java-frontend
    ports:
      - "4200:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: tinylink-java-db
    environment:
      POSTGRES_DB: tinylink
      POSTGRES_USER: tinylink
      POSTGRES_PASSWORD: tinylink
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinylink -d tinylink"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db_data:
